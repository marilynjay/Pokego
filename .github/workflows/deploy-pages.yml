name: Deploy to GitHub Pages

on:
  push:
    # main only: the github-pages environment refuses deployments from any
    # other branch, and a doomed run still holds the concurrency slot, stalling
    # the real deploy behind it.
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Kept free of an `environment:` so it isn't gated on Pages already existing —
  # this is the job that turns Pages on and creates the github-pages environment.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable and configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      # The app is static: the repo root is the site, no build step.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
